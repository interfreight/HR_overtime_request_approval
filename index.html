<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INTERFREIGHT | HR Overtime Approval</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
    padding:30px;
}

/* HEADER */

.hero{
    background:linear-gradient(135deg,#003366,#004d99);
    color:white;
    padding:25px 35px;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.hero h1{
    font-size:34px;
}

.hero p{
    margin-top:5px;
    opacity:.9;
}

.btn{
    background:#F4C542;
    color:#003366;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat{
    background:white;
    padding:25px;
    border-radius:20px;
    border-top:5px solid #F4C542;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.stat h3{
    color:#666;
    font-size:15px;
    margin-bottom:10px;
}

.stat span{
    font-size:40px;
    font-weight:bold;
    color:#003366;
}

/* FILTER */

.filter{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    margin-bottom:25px;

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(200px,1fr));

    gap:15px;
}

.filter input,
.filter select{
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

/* TABLE */

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#003366;
    color:white;
    padding:14px;
    text-align:left;
    white-space:nowrap;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

tr:hover{
    background:#f8fafc;
}

/* STATUS */

.status{
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
    display:inline-block;
}

.waiting{
    background:#ffc107;
    color:#333;
}

.approved{
    background:#28a745;
    color:white;
}

.rejected{
    background:#dc3545;
    color:white;
}

/* BUTTONS */

.approve-btn{
    background:#28a745;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    margin-right:5px;
}

.reject-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.approve-btn:hover{
    background:#218838;
}

.reject-btn:hover{
    background:#c82333;
}

.remarks{
    max-width:220px;
    white-space:normal;
}

</style>

</head>

<body>


<!-- HEADER -->

<div class="hero">

    <div>

        <h1>HR Overtime Approval</h1>

        <p id="hrInfo">
            Loading...
        </p>

    </div>

    <a
        href="https://interfreight.github.io/Hr_Dashboard/"
        class="btn">

        ← Dashboard

    </a>

</div>


<!-- STATS -->

<div class="stats">

    <div class="stat">

        <h3>Waiting for HR Approval</h3>

        <span id="waitingCount">
            0
        </span>

    </div>


    <div class="stat">

        <h3>HR Approved</h3>

        <span id="approvedCount">
            0
        </span>

    </div>


    <div class="stat">

        <h3>HR Rejected</h3>

        <span id="rejectedCount">
            0
        </span>

    </div>


    <div class="stat">

        <h3>Total Records</h3>

        <span id="totalCount">
            0
        </span>

    </div>

</div>


<!-- FILTER -->

<div class="filter">

    <input
        type="text"
        id="searchEmployee"
        placeholder="Search employee...">


    <select id="statusFilter">

        <option value="ALL">
            All HR Status
        </option>

        <option value="Waiting">
            Waiting
        </option>

        <option value="Approved">
            Approved
        </option>

        <option value="Rejected">
            Rejected
        </option>

    </select>


    <input
        type="date"
        id="dateFilter">

</div>


<!-- TABLE -->

<div class="card">

<table>

<thead>

<tr>

<th>Employee</th>

<th>Department</th>

<th>Position</th>

<th>OT Date</th>

<th>Time In</th>

<th>Time Out</th>

<th>Total Hours</th>

<th>Manager Status</th>

<th>Manager Approved By</th>

<th>Manager Approved Date</th>

<th>HR Status</th>

<th>HR Remarks</th>

<th>Attachment</th>

<th>Action</th>

</tr>

</thead>


<tbody id="historyTable">

<tr>

<td
colspan="14"
style="text-align:center">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


<script>

/******************************************
SUPABASE
******************************************/

const db =
window.supabase.createClient(

"https://tuihpvykuqbqnfyfepql.supabase.co",

"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1aWhwdnlrdXFicW5meWZlcHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjg4OTcsImV4cCI6MjA5NzMwNDg5N30.HZKS8CgFLjkZ-Bx2AIjFjurH3IsKjvf37Ft852CzJsQ"

);


/******************************************
CURRENT USER
******************************************/

const currentUser =
JSON.parse(
localStorage.getItem("currentUser")
);


if(!currentUser){

    location.href =
    "https://interfreight.github.io/login/";

}


document.getElementById("hrInfo").innerHTML =

currentUser.full_name +
" • " +
currentUser.role;


/******************************************
HR SECURITY CHECK
******************************************/

if(
    (currentUser.role || "").toUpperCase()
    !== "HR"
){

    alert(
        "Access denied. HR only."
    );

    location.href =
    "https://interfreight.github.io/login/";

}


/******************************************
LOAD HR OVERTIME REQUESTS
******************************************/

async function loadHistory(){

    const tbody =
    document.getElementById(
        "historyTable"
    );

    tbody.innerHTML =

    `<tr>
        <td colspan="14"
        style="text-align:center">
        Loading...
        </td>
    </tr>`;


    /*
       HR ONLY SEES:

       Manager approved
       AND
       Waiting for HR
    */

    const {
        data,
        error
    } = await db

    .from("employee_overtime")

    .select("*")

    .eq(
        "department_status",
        "Approved"
    )

    .order(
        "department_approved_date",
        {
            ascending:false
        }
    );


    if(error){

        tbody.innerHTML =

        `<tr>
            <td colspan="14">
            ${error.message}
            </td>
        </tr>`;

        return;

    }


    renderTable(data);

}


/******************************************
RENDER TABLE
******************************************/

function renderTable(data){

    const tbody =
    document.getElementById(
        "historyTable"
    );

    tbody.innerHTML = "";


    let waiting = 0;

    let approved = 0;

    let rejected = 0;


    data.forEach(row => {


        if(
            row.hr_status === "Waiting"
        ){
            waiting++;
        }


        if(
            row.hr_status === "Approved"
        ){
            approved++;
        }


        if(
            row.hr_status === "Rejected"
        ){
            rejected++;
        }


        let action = "";


        /*
           ONLY WAITING REQUESTS
           CAN BE APPROVED / REJECTED
        */

       if(
    !row.hr_status ||
    row.hr_status === "Waiting" ||
    row.hr_status === "Pending"
){

    action = `

        <button
            class="approve-btn"
            onclick="approveOT('${row.id}')">
            Approve
        </button>

        <button
            class="reject-btn"
            onclick="rejectOT('${row.id}')">
            Reject
        </button>

    `;

}

        else{

            action = `

            <b>

            ${
                row.hr_status
                || "Completed"
            }

            </b>

            `;

        }


        tbody.innerHTML += `

        <tr>


        <td>

            ${row.employee_name}

        </td>


        <td>

            ${row.department}

        </td>


        <td>

            ${row.position || "-"}

        </td>


        <td>

            ${row.overtime_date}

        </td>


        <td>

            ${row.time_in}

        </td>


        <td>

            ${row.time_out}

        </td>


        <td>

            ${row.total_hours}

        </td>


        <td>

            <span class="status approved">

                ${row.department_status}

            </span>

        </td>


        <td>

            ${row.department_approved_by || "-"}

        </td>


        <td>

            ${
                row.department_approved_date
                ?
                new Date(
                    row.department_approved_date
                ).toLocaleString()
                :
                "-"
            }

        </td>


        <td>

            <span class="status ${
                (row.hr_status || "")
                .toLowerCase()
            }">

                ${row.hr_status || "-"}

            </span>

        </td>


        <td class="remarks">

            ${
                row.remarks
                ?
                `<span style="
                    color:${
                        row.hr_status === "Rejected"
                        ? "#dc3545"
                        : "#003366"
                    };
                    font-weight:600;
                ">
                    ${row.remarks}
                </span>`
                :
                "-"
            }

        </td>


        <td>

            ${
                row.attachment

                ?

                `<a
                    href="${row.attachment}"
                    target="_blank">

                    View

                </a>`

                :

                "-"
            }

        </td>


        <td>

            ${action}

        </td>


        </tr>

        `;

    });


    document.getElementById(
        "waitingCount"
    ).textContent = waiting;


    document.getElementById(
        "approvedCount"
    ).textContent = approved;


    document.getElementById(
        "rejectedCount"
    ).textContent = rejected;


    document.getElementById(
        "totalCount"
    ).textContent = data.length;


    window.overtimeData = data;

}


/******************************************
HR APPROVE
******************************************/

async function approveOT(id){

    if(
        !confirm(
            "Approve this overtime request as HR?"
        )
    ){

        return;

    }


    const {
        error
    } = await db

    .from("employee_overtime")

    .update({

        hr_status:
        "Approved",

        hr_approved_by:
        currentUser.full_name,

        hr_approved_date:
        new Date().toISOString(),

        approved_hours:
        null

    })

    .eq("id", id);


    if(error){

        alert(
            error.message
        );

        return;

    }


    alert(
        "Overtime request approved by HR."
    );


    loadHistory();

}


/******************************************
HR REJECT
******************************************/

async function rejectOT(id){

    const remarks =
    prompt(
        "Enter reason for HR rejection:"
    );


    if(
        remarks === null
    ){

        return;

    }


    if(
        remarks.trim() === ""
    ){

        alert(
            "Please provide a reason."
        );

        return;

    }


    const {
        error
    } = await db

    .from("employee_overtime")

    .update({

        hr_status:
        "Rejected",

        remarks:
        remarks,

        hr_approved_by:
        currentUser.full_name,

        hr_approved_date:
        new Date().toISOString()

    })

    .eq("id", id);


    if(error){

        alert(
            error.message
        );

        return;

    }


    alert(
        "Overtime request rejected by HR."
    );


    loadHistory();

}


/******************************************
SEARCH / FILTER
******************************************/

function applyFilters(){

    let rows =
    window.overtimeData || [];


    const employee =
    document
    .getElementById(
        "searchEmployee"
    )
    .value
    .toLowerCase();


    const status =
    document
    .getElementById(
        "statusFilter"
    )
    .value;


    const date =
    document
    .getElementById(
        "dateFilter"
    )
    .value;


    rows =
    rows.filter(r => {


        if(
            employee &&
            !(r.employee_name || "")
            .toLowerCase()
            .includes(employee)
        ){

            return false;

        }


        if(
            status !== "ALL" &&
            r.hr_status !== status
        ){

            return false;

        }


        if(
            date &&
            r.overtime_date !== date
        ){

            return false;

        }


        return true;

    });


    renderTable(rows);

}


/******************************************
FILTER EVENTS
******************************************/

document
.getElementById(
    "searchEmployee"
)
.addEventListener(
    "keyup",
    applyFilters
);


document
.getElementById(
    "statusFilter"
)
.addEventListener(
    "change",
    applyFilters
);


document
.getElementById(
    "dateFilter"
)
.addEventListener(
    "change",
    applyFilters
);


/******************************************
AUTO REFRESH
******************************************/

loadHistory();

setInterval(
    loadHistory,
    5000
);

</script>

</body>

</html>
